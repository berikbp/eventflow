services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow_local}
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-eventflow_local}@db:5432/${POSTGRES_DB:-eventflow}
      ORGANIZER_TOKEN: ${ORGANIZER_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=6)"]
      interval: 10s
      timeout: 7s
      retries: 5
  worker:
    build: ./backend
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eventflow}:${POSTGRES_PASSWORD:-eventflow_local}@db:5432/${POSTGRES_DB:-eventflow}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-EventFlow <noreply@eventflow.local>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
    depends_on:
      backend:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 7s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
volumes:
  postgres_data:
