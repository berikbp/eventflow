[project]
name = "eventflow"
version = "0.1.0"
description = "EventFlow API"
authors = [
    { name = "Satybaldy Berik", email = "240107019@sdu.edu.kz" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
